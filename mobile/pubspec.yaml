name: voxnote_mobile
description: VoxNote voice-first note-taking app mobile client.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6
  cloud_functions: ^5.1.3
  google_sign_in: ^6.2.2
  record: ^5.1.2
  audioplayers: ^6.0.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
